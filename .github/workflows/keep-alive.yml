name: Keep production database awake

# Supabase pauses free projects after 7 days without activity. Until launch
# (and a paid plan), one tiny query a day keeps the production project awake.
# Remove this workflow once the project is on a paid plan.
#
# Secret: SUPABASE_DB_URL (the same one migrate.yml uses).

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (off the hour, when runners are busy)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: select 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # psql ships with the Ubuntu runner image.
      - run: psql "$SUPABASE_DB_URL" --no-psqlrc --quiet --tuples-only -c "select 1" > /dev/null
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
