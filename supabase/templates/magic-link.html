<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Your Slotwren sign-in link</title>
  </head>
  <!--
    Used for both the magic_link and confirmation (first sign-in) templates.
    Paste the same body into Supabase Dashboard → Authentication → Emails for
    production. Colours mirror docs/design/globals.css (emails can't use CSS
    variables).
  -->
  <body
    style="
      margin: 0;
      padding: 0;
      background: #fafaf9;
      font-family: -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;
      color: #1c1917;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #fafaf9"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px"
          >
            <tr>
              <td
                style="
                  padding: 0 0 24px;
                  font-size: 20px;
                  font-weight: 600;
                  letter-spacing: -0.01em;
                  color: #1c1917;
                "
              >
                Slotwren
              </td>
            </tr>
            <tr>
              <td
                style="
                  background: #ffffff;
                  border: 1px solid #e7e5e4;
                  border-radius: 14px;
                  padding: 32px;
                "
              >
                <h1
                  style="
                    margin: 0 0 8px;
                    font-size: 24px;
                    line-height: 32px;
                    font-weight: 600;
                    letter-spacing: -0.015em;
                    color: #1c1917;
                  "
                >
                  Sign in to Slotwren
                </h1>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 24px; color: #57534e">
                  Tap the button to sign in as {{ .Email }}. The link works once and expires in 1
                  hour.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius: 10px; background: #0f766e">
                      <a
                        href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
                        style="
                          display: inline-block;
                          padding: 12px 20px;
                          font-size: 16px;
                          font-weight: 600;
                          line-height: 24px;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 10px;
                        "
                        >Sign in to Slotwren</a
                      >
                    </td>
                  </tr>
                </table>
                <p style="margin: 24px 0 0; font-size: 14px; line-height: 20px; color: #57534e">
                  Didn&rsquo;t ask for this? You can ignore this email; nobody can sign in without
                  the link.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 0 0; font-size: 12px; line-height: 16px; color: #78716c">
                Slotwren &middot; Your front desk, open 24/7.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
